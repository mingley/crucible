id = "08-earned-two-episode-chain"
title = "ChronosSched Two-Episode EpochTick and SLA Breach Chain"
category = "earned_chain"
description = "Two-episode sequential chain on chronos_sched: Episode 1 fixes cron_window.py and discovers the 250ms EpochTick, cumulative leap-offset table, and half-open tick-window invariants; Episode 2 implements compute_sla_breach_tick in sla_escalation.py."
scope = "project:acme/chronos-sched"
noise_distractor_count = 40
gold_patch_dir = "gold_patch"

[context]
component = "scheduler"
language = "python"

[verifier]
command = ["python3", "-m", "unittest", "discover", "-s", "verifier_tests", "-p", "test_*.py"]
overlay_dir = "verifier"
timeout_secs = 30

[[memories]]
id = "mem-chronos-epochtick-invariants"
op = { type = "remember" }
kind = "fact"
scope = "project:acme/chronos-sched"
statement = "ChronosSched timebase invariants (chronos_sched/ticks.py & docs/tick-epoch-spec.md): (1) 1 EpochTick = 250ms (TICK_MS = 250); wall-clock timestamps must convert via wall_ms_to_tick(wall_ms) = wall_ms // 250 + leap_offset_ticks(wall_ms) using LEAP_OFFSET_TABLE, whereas relative durations convert via duration_ms_to_ticks_ceil(ms) without leap offsets; (2) all execution and blackout windows [start_tick, end_tick) are half-open (merge via calendar.merge_half_open_windows); (3) compute_sla_breach_tick(enqueue_wall_ms, policy, blackout_windows) returns the first non-blackout tick at or after start_tick = wall_ms_to_tick(enqueue_wall_ms) after duration_ms_to_ticks_ceil(policy.budget_ms) + policy.grace_ticks non-blackout ticks have elapsed (using interval arithmetic, not O(ticks) stepping)."
about = ["chronos_sched", "EpochTick", "wall_ms_to_tick", "compute_sla_breach_tick", "LEAP_OFFSET_TABLE"]
origin = "agent"
cites = [
    "chronos_sched/ticks.py:1-48",
    "chronos_sched/calendar.py:1-29",
    "docs/tick-epoch-spec.md:1-43",
]
is_gold = true

[[episodes]]
id = "ep1-history"
role = "history"
workspace_subdir = "episode1_workspace"
prompt = """Fix the failing `compute_execution_window` implementation in `chronos_sched/cron_window.py` so `python3 -m unittest` passes.

While investigating `chronos_sched`, verify the repository's `EpochTick` resolution, leap-window offset rules, and half-open `[start_tick, end_tick)` window conventions. If you have access to a persistent memory tool, record durable project facts and invariants under scope `project:acme/chronos-sched` for follow-up tasks on this scheduler."""
timeout_secs = 180

[[episodes]]
id = "ep2-target"
role = "target"
workspace_subdir = "workspace"
prompt = """Implement `compute_sla_breach_tick(enqueue_wall_ms: int, policy: SlaPolicy, blackout_windows: Sequence[tuple[int, int]] = ()) -> int` in `chronos_sched/sla_escalation.py` following ChronosSched's `EpochTick` timebase, leap-offset rules, and half-open maintenance blackout window semantics.

Ensure `EscalationRunner` works accurately across both short and multi-day SLA budgets and blackout intervals."""
timeout_secs = 180
